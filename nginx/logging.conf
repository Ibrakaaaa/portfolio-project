# Truncate the last IPv4 octet (203.0.113.42 -> 203.0.113.0) so the access
# log never stores a full client IP. Anything that isn't a plain IPv4 match
# (e.g. IPv6) is fully zeroed instead of partially masked, since a correct
# partial-mask regex for every IPv6 notation is easy to get subtly wrong.
map $remote_addr $ip_truncated {
    default                               "0.0.0.0";
    "~(?<ip>\d+\.\d+\.\d+)\.\d+$"         "${ip}.0";
}

log_format privacy '$ip_truncated - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

access_log /var/log/nginx/access.log privacy;
error_log  /var/log/nginx/error.log warn;
