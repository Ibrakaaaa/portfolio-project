location / {
    root /usr/share/nginx/landing;
    index index.html;
}

location /app/ {
    rewrite ^/app/(.*)$ /$1 break;
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
