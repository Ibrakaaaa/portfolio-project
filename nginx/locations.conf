location / {
    root /usr/share/nginx/landing;
    index index.html;
    try_files $uri $uri.html $uri/ =404;
}

location /app/ {
    rewrite ^/app/(.*)$ /$1 break;
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;

    # api_read applies to every request (its key is always the client IP).
    # api_write's key is empty for GET/HEAD (see rate-limiting.conf), so it
    # only ever limits POST/PUT/DELETE -- the two apply together on writes.
    limit_req zone=api_read burst=20 nodelay;
    limit_req zone=api_write burst=3 nodelay;
}
