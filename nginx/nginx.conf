events {}

http {
  include /etc/nginx/mime.types;
  include /etc/nginx/logging.conf;
  include /etc/nginx/rate-limiting.conf;
  server_tokens off;

  server {
    listen 80;
    server_name ibrahimmerkez.com www.ibrahimmerkez.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name ibrahimmerkez.com www.ibrahimmerkez.com;

    ssl_certificate     /etc/letsencrypt/live/ibrahimmerkez.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ibrahimmerkez.com/privkey.pem;

    include /etc/nginx/locations.conf;
  }
}