events {}

http {
  server {
    listen 80;
    server_name ibrahimmerkez.com www.ibrahimmerkez.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name ibrahimmerkez.com www.ibrahimmerkez.com;

    ssl_certificate     /etc/letsencrypt/live/ibrahimmerkez.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ibrahimmerkez.com/privkey.pem;

    location / {
      proxy_pass http://frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://backend:5000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}