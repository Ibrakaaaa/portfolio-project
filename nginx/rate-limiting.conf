# limit_req is only valid in http/server/location context -- it cannot be
# used inside limit_except. Instead, a map produces an empty key for every
# method except POST/PUT/DELETE; a request with an empty key is not counted
# against a zone at all, so GET/HEAD never touch api_write.
map $request_method $write_method_key {
    default "";
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
    DELETE  $binary_remote_addr;
}

limit_req_zone $write_method_key zone=api_write:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_read:10m rate=120r/m;
limit_req_status 429;
